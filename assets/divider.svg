<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" width="1200" height="46" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.fl{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.75}35%{opacity:1}60%{opacity:.5}}
.rise{animation:rise var(--d,20s) linear infinite;animation-delay:var(--o,0s)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:1}30%{transform:translate(14px,-150px)}60%{transform:translate(-10px,-300px)}90%{opacity:.9}100%{transform:translate(8px,-480px);opacity:0}}
.rise2{animation:rise2 var(--d,16s) linear infinite;animation-delay:var(--o,0s)}
@keyframes rise2{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(10px,-90px)}90%{opacity:.8}100%{transform:translate(-6px,-170px);opacity:0}}
.bob{animation:bob 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%{transform:translate(-10px,0) rotate(-1.6deg)}100%{transform:translate(10px,-3px) rotate(1.6deg)}}
.hover{animation:hover 4s ease-in-out infinite alternate}
@keyframes hover{0%{transform:translateY(0)}100%{transform:translateY(-7px)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.flow{stroke-dasharray:6 10;animation:flow 2.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.wave{animation:wave 9s linear infinite}
@keyframes wave{to{transform:translateX(-120px)}}
.spark{animation:spark 3s ease-out infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--x,10px),-60px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<radialGradient id="glow"><stop offset="0" stop-color="#ffd978" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb347" stop-opacity=".32"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
<radialGradient id="moonglow"><stop offset="0" stop-color="#fff1c9" stop-opacity=".55"/><stop offset="1" stop-color="#fff1c9" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop offset="0" stop-color="#d9c8ff" stop-opacity=".9"/><stop offset="1" stop-color="#8b6cff" stop-opacity="0"/></radialGradient>
<radialGradient id="horizon"><stop offset="0" stop-color="#ff8fb8" stop-opacity=".45"/><stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/></radialGradient>
<linearGradient id="lam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffc857"/><stop offset="1" stop-color="#f08a24"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050818"/><stop offset=".45" stop-color="#14104a"/><stop offset=".8" stop-color="#3a1d6e"/><stop offset="1" stop-color="#7a3b8c"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d2e"/><stop offset="1" stop-color="#241555"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a63"/><stop offset="1" stop-color="#0a0b2b"/></linearGradient>
<linearGradient id="goldtxt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#fff6d1"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="420 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc857" stop-opacity="0"/><stop offset=".5" stop-color="#ffc857"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<g id="lanbody">
<rect x="-6" y="-15" width="12" height="3" rx="1" fill="#9a5b1a"/>
<path d="M-6 -12 C-15 -5 -13 8 -6 13 H6 C13 8 15 -5 6 -12 Z" fill="url(#lam)" stroke="#b86d1a" stroke-width=".8"/>
<rect x="-5" y="13" width="10" height="3" rx="1" fill="#9a5b1a"/>
<circle r="3" fill="none" stroke="#b5561a" stroke-width=".9"/>
<path d="M0 -7V-5M0 5V7M-7 0H-5M5 0H7M-5 -5L-3.6 -3.6M5 5L3.6 3.6M5 -5L3.6 -3.6M-5 5L-3.6 3.6" stroke="#b5561a" stroke-width=".8" stroke-linecap="round"/>
</g>
<g id="lan"><circle r="38" fill="url(#glow)"/><use href="#lanbody"/></g>
</defs><rect y="22" width="1200" height="1.6" fill="url(#rule)"/><path class="tw" d="M180 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-0.0s"/><path class="tw" d="M330 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-0.7s"/><path class="tw" d="M470 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-1.4s"/><path class="tw" d="M730 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-2.1s"/><path class="tw" d="M870 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-2.8s"/><path class="tw" d="M1020 23 l1.5 -5 1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5z" fill="#ffd978" style="animation-delay:-3.5s"/><g class="hover"><g transform="translate(600 23) scale(.85)"><use href="#lan"/></g></g></svg>